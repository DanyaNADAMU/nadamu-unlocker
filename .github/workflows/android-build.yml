name: Android CI / Build APK

on:
  push:
    branches: [ "main" ]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'
        build-root-directory: android

    - name: Ensure Android SDK / Build Tools
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

    - name: Run Unit Tests
      working-directory: android
      run: |
        gradle test --stacktrace --no-daemon

    - name: Build Debug APK
      working-directory: android
      run: |
        gradle assembleDebug --stacktrace --no-daemon

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: nadamu-unlocker-debug
        path: android/app/build/outputs/apk/debug/*.apk
        retention-days: 7
