name: Release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
      draft:
        description: "Create draft release"
        type: boolean
        default: false
      prerelease:
        description: "Mark as prerelease"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  release-apk:
    name: Build, Sign & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version Tag
        id: version_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Building release for tag: $TAG"

      - name: Set up JDK 25 (Corretto)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.7.1'
          build-root-directory: android

      - name: Ensure Android SDK / Build Tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-35" "build-tools;36.0.0" "build-tools;35.0.0"

      - name: Run Unit Tests
        working-directory: android
        run: |
          gradle test --stacktrace --no-daemon

      - name: Build Release APK
        working-directory: android
        run: |
          gradle assembleRelease --stacktrace --no-daemon

      - name: Locate and Sign APK
        id: sign_apk
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TAG_NAME: ${{ steps.version_info.outputs.tag }}
        run: |
          set -e

          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)

          echo "Using zipalign: $ZIPALIGN"
          echo "Using apksigner: $APKSIGNER"

          # Locate built APK
          echo "Looking for APK in android/app/build/outputs/apk/..."
          find android/app/build/outputs/apk/ -type f || true

          RAW_APK=$(find android/app/build/outputs/apk/release/ -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$RAW_APK" ]; then
            RAW_APK=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          fi

          if [ -z "$RAW_APK" ] || [ ! -f "$RAW_APK" ]; then
            echo "ERROR: No APK file was generated by Gradle assembleRelease!"
            exit 1
          fi

          echo "Found APK to sign: $RAW_APK"
          FINAL_APK="nadamu-unlocker-${TAG_NAME}.apk"

          # Prepare aligned APK
          "$ZIPALIGN" -f -p 4 "$RAW_APK" app-aligned.apk

          SIGNED=false
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "Decoding release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > release.jks
            
            KEY_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"

            if keytool -list -keystore release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              echo "Keystore verified successfully. Signing release APK..."
              "$APKSIGNER" sign --ks release.jks \
                --ks-pass "pass:$KEYSTORE_PASSWORD" \
                --ks-key-alias "$KEY_ALIAS" \
                --key-pass "pass:$KEY_PASS" \
                --out "$FINAL_APK" \
                app-aligned.apk
              SIGNED=true
            else
              echo "WARNING: Keystore validation failed with given alias/password. Falling back to debug key..."
            fi
            rm -f release.jks
          fi

          if [ "$SIGNED" = false ]; then
            echo "Signing with repository permanent release keystore..."
            REPO_KEYSTORE="android/app/keystore/release.jks"

            "$APKSIGNER" sign --ks "$REPO_KEYSTORE" \
              --ks-pass pass:nadamu-unlocker-2026 \
              --ks-key-alias nadamu \
              --key-pass pass:nadamu-unlocker-2026 \
              --out "$FINAL_APK" \
              app-aligned.apk
          fi

          rm -f app-aligned.apk

          echo "Verifying signature of $FINAL_APK..."
          "$APKSIGNER" verify --verbose "$FINAL_APK"

          echo "Generating SHA-256 checksum..."
          sha256sum "$FINAL_APK" > "${FINAL_APK}.sha256"
          cat "${FINAL_APK}.sha256"

          echo "final_apk=$FINAL_APK" >> $GITHUB_OUTPUT
          echo "final_sha256=${FINAL_APK}.sha256" >> $GITHUB_OUTPUT

      - name: Upload Release Artifacts to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: nadamu-unlocker-${{ steps.version_info.outputs.tag }}
          path: |
            ${{ steps.sign_apk.outputs.final_apk }}
            ${{ steps.sign_apk.outputs.final_sha256 }}
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version_info.outputs.tag }}
          name: Release ${{ steps.version_info.outputs.tag }}
          files: |
            ${{ steps.sign_apk.outputs.final_apk }}
            ${{ steps.sign_apk.outputs.final_sha256 }}
          generate_release_notes: true
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || contains(steps.version_info.outputs.tag, '-beta') || contains(steps.version_info.outputs.tag, '-rc') }}
